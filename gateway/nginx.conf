events {}

# dongorae 단일 진입 게이트웨이 (:8000).
# 한 origin으로 세션 쿠키(sid)를 공유하고, nginx auth_request로 /don/(dongorae)을
# "로그인 + 관리자 승인" 뒤로 보호한다. 미승인/미로그인 → 랜딩(/)으로.
# 랜딩(/)=auth 서버가 로그인/승인대기/앱이동을 판단.
http {
    # 이게 없으면 게이트웨이가 직접 내보내는 파일이 전부 text/plain으로 나간다.
    # 브라우저는 text/plain인 스타일시트를 아예 적용하지 않는다(=/shared/base.css 무시됨).
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name _;
        resolver 127.0.0.11 valid=10s ipv6=off;   # Docker DNS
        # 컨테이너는 80으로 듣지만 외부는 :8000 → 절대 리다이렉트가 :80 붙여 브라우저 튕김 방지.
        absolute_redirect off;

        # 승인 안 됨/로그인 안 됨 → 랜딩으로
        location @needlogin { return 302 /; }

        # 내부 인증 체크: 로그인 + 승인된 유저만 200 (auth /api/authorized)
        location = /_authcheck {
            internal;
            set $auth http://auth-app:8000;
            proxy_pass $auth/api/authorized;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
        }

        # 랜딩 / (auth: 로그인 / 승인대기 / 승인됨→/don/)
        location = / {
            set $auth http://auth-app:8000;
            proxy_pass $auth/;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
        }

        # auth-server 패스스루 (로그인/콜백/로그아웃/관리자/me)
        location /auth/ {
            set $auth http://auth-app:8000;
            proxy_pass $auth$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }
        location /admin {
            set $auth http://auth-app:8000;
            proxy_pass $auth$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
        }
        location = /api/me {
            set $auth http://auth-app:8000;
            proxy_pass $auth/api/me;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
        }
        location = /logout {
            set $auth http://auth-app:8000;
            proxy_pass $auth/logout;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
        }

        # 두 앱이 같이 쓰는 디자인 토큰·전환 바 스타일. 한 곳만 고치면 양쪽이 바뀐다.
        location /shared/ {
            alias /srv/shared/;
            add_header Cache-Control "public, max-age=300";
        }

        location = /don { return 301 /don/; }

        # dongorae (통합 앱) — 로그인+승인자만. /don/ 제거 후 don-app로.
        location /don/ {
            auth_request /_authcheck;
            error_page 401 = @needlogin;
            set $up http://don-app:8000;
            rewrite ^/don(/.*)$ $1 break;
            proxy_pass $up;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            # 로그아웃 후 캐시된 보호 페이지 노출 방지
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

    }
}
